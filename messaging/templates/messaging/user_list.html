<h1>
    کاربران
</h1>

<ul>

{% for user in users %}

    <li>

        {{ user.get_full_name|default:user.username }}

        ({{ user.get_role_display }})

        <a href="{% url 'start_conversation' user.id %}">
            💬 پیام
        </a>

    </li>

{% empty %}

    <li>
        کاربری یافت نشد.
    </li>

{% endfor %}

</ul>
