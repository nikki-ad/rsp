<h1>
    حذف تکلیف
</h1>

<p>
    آیا مطمئن هستید که می‌خواهید تکلیف
    <strong>{{ assignment.title }}</strong>
    را حذف کنید؟
</p>

<p>
    با حذف این تکلیف، پاسخ‌های ثبت‌شده دانش‌آموزان برای آن هم حذف می‌شوند.
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        بله، حذف شود
    </button>
</form>

<br>

<a href="{% url 'teacher_class_detail' assignment.classroom.id %}">
    انصراف
</a>
