{% extends "base.html" %}

{% block title %}حذف تکلیف | RSP{% endblock %}

{% block content %}
<div class="card confirm-card">
    <h1>حذف تکلیف</h1>
    <p>
        آیا مطمئن هستید که می‌خواهید تکلیف
        <strong>{{ assignment.title }}</strong>
        را حذف کنید؟
    </p>
    <p class="alert-warning">با حذف این تکلیف، پاسخ‌های ثبت‌شده دانش‌آموزان هم حذف می‌شوند.</p>

    <form method="post">
        {% csrf_token %}
        <div class="confirm-actions">
            <button class="btn btn-danger" type="submit">بله، حذف شود</button>
            <a class="btn btn-ghost" href="{% url 'teacher_class_detail' assignment.classroom.id %}">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
