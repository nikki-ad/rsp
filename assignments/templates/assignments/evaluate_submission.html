{% extends "base.html" %}

{% block title %}ارزیابی پاسخ | RSP{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>ارزیابی پاسخ تکلیف</h1>
        <p>{{ submission.assignment.title }} — {{ submission.student }}</p>
    </div>
</div>

<div class="card form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">ثبت ارزیابی</button>
    </form>
</div>
{% endblock %}
