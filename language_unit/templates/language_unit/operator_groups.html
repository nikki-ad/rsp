{% extends "base.html" %}
{% block title %}نظارت واحد زبان | RSP{% endblock %}
{% block content %}
<div class="page-header"><h1>نظارت واحد زبان</h1></div>
<div class="class-grid">
    {% for group in groups %}
        <article class="class-card">
            <h2>{{ group.title }}</h2>
            <p>{{ group.academic_year }}</p>
            <div class="card-actions">
                <a class="btn btn-secondary" href="{% url 'language_group_material_list' group.id %}">مطالب</a>
                <a class="btn btn-secondary" href="{% url 'language_group_assignment_list' group.id %}">تکالیف</a>
            </div>
        </article>
    {% empty %}
        <p>هنوز گروه زبانی ثبت نشده است.</p>
    {% endfor %}
</div>
{% endblock %}
