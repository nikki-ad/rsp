<a class="btn btn-secondary" href="{% url 'download_material' material.id %}">{% if material.content_type == 'image' %}دریافت عکس مطلب{% elif material.content_type == 'video' %}دریافت فیلم مطلب{% else %}دریافت فایل مطلب{% endif %}</a>
{% endif %}
