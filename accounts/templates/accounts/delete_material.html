{% extends "base.html" %}

{% block title %}حذف مطلب | RSP{% endblock %}

{% block content %}
<div class="card confirm-card">
    <h1>حذف مطلب آموزشی</h1>
    <p>
        آیا مطمئن هستید که می‌خواهید مطلب
        <strong>{{ material.title }}</strong>
        را حذف کنید؟
    </p>
    <p class="alert-warning">این عملیات قابل بازگشت نیست.</p>

    <form method="post">
        {% csrf_token %}
        <div class="confirm-actions">
            <button class="btn btn-danger" type="submit">بله، حذف شود</button>
            <a class="btn btn-ghost" href="{% url 'teacher_class_detail' classroom.id %}">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
